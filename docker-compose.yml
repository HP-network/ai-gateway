services:
  ai-gateway:
    build: .
    ports:
      - "${AI_GATEWAY_PORT:-8080}:8080"
    environment:
      AI_GATEWAY_HOST: ${AI_GATEWAY_HOST:-0.0.0.0}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      AI_GATEWAY_ADMIN_API_KEY: ${AI_GATEWAY_ADMIN_API_KEY:-}
      AI_GATEWAY_DATABASE: ${AI_GATEWAY_DATABASE:-/data/ai-gateway.db}
      AI_GATEWAY_RATE_LIMIT: ${AI_GATEWAY_RATE_LIMIT:-120}
      AI_GATEWAY_TIMEOUT: ${AI_GATEWAY_TIMEOUT:-45}
      AI_GATEWAY_MAX_RETRIES: ${AI_GATEWAY_MAX_RETRIES:-2}
      AI_GATEWAY_UPSTREAM_API_KEY: ${AI_GATEWAY_UPSTREAM_API_KEY:-}
      AI_GATEWAY_UPSTREAM_BASE_URL: ${AI_GATEWAY_UPSTREAM_BASE_URL:-https://api.openai.com/v1}
      AI_GATEWAY_UPSTREAM_MODEL: ${AI_GATEWAY_UPSTREAM_MODEL:-gpt-4o-mini}
      AI_GATEWAY_UPSTREAM_NAME: ${AI_GATEWAY_UPSTREAM_NAME:-primary}
      AI_GATEWAY_UPSTREAM_KIND: ${AI_GATEWAY_UPSTREAM_KIND:-openai-compatible}
      AI_GATEWAY_UPSTREAM_TIMEOUT: ${AI_GATEWAY_UPSTREAM_TIMEOUT:-45}
      AI_GATEWAY_UPSTREAM_MAX_CONCURRENCY: ${AI_GATEWAY_UPSTREAM_MAX_CONCURRENCY:-32}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-haiku-latest}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      RUST_LOG: ${RUST_LOG:-ai_gateway=info,tower_http=info}
    volumes:
      - ai-gateway-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  ai-gateway-data:
