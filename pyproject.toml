[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-gateway"
version = "0.1.2"
description = "A small, production-minded multi-provider LLM gateway with routing and failover."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "HPnetwork" }]
keywords = ["ai", "llm", "gateway", "openai", "anthropic", "gemini", "ollama", "routing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

[project.scripts]
ai-gateway = "ai_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
