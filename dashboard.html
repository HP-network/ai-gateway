<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Gateway Console</title>
  <style>
    :root{color-scheme:dark;--bg:#090b0d;--surface:#111417;--surface2:#161a1e;--line:#2a3036;--text:#f1f3f5;--muted:#929ba4;--cyan:#46c2d0;--green:#4fd18b;--amber:#e6b85c;--red:#ef6b73}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:0}button,input{font:inherit}button{background:var(--surface2);border:1px solid var(--line);border-radius:6px;color:var(--text);cursor:pointer;padding:8px 12px}button:hover{border-color:#52606c}input{background:#0c0f12;border:1px solid var(--line);border-radius:6px;color:var(--text);min-width:180px;padding:8px 10px}main{margin:auto;max-width:1280px;padding:26px 24px 60px}header{align-items:center;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;margin-bottom:22px;padding-bottom:18px}.brand{align-items:center;display:flex;gap:12px}.mark{align-items:center;background:var(--cyan);border-radius:6px;color:#071013;display:flex;font-size:13px;font-weight:800;height:34px;justify-content:center;width:34px}.brand h1{font-size:18px;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:2px}.actions,.form{display:flex;flex-wrap:wrap;gap:8px}.stats{display:grid;gap:10px;grid-template-columns:repeat(5,1fr);margin-bottom:22px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:14px}.label{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase}.value{font-size:23px;font-weight:700;margin-top:5px}.section{border-top:1px solid var(--line);padding:20px 0}.section-head{align-items:center;display:flex;justify-content:space-between;margin-bottom:12px}.section h2{font-size:14px;margin:0}.count{color:var(--muted);font-size:12px}.provider-grid{display:grid;gap:10px;grid-template-columns:repeat(3,1fr)}.provider{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:14px}.provider-top{align-items:center;display:flex;justify-content:space-between}.provider-name{font-weight:700}.meta{color:var(--muted);font-size:12px;margin-top:8px}.dot{border-radius:50%;display:inline-block;height:7px;margin-right:6px;width:7px}.dot.healthy{background:var(--green)}.dot.degraded{background:var(--amber)}.dot.unavailable{background:var(--red)}.dot.unknown{background:var(--muted)}.table-wrap{border:1px solid var(--line);border-radius:7px;overflow:auto}table{border-collapse:collapse;min-width:760px;width:100%}th,td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;white-space:nowrap}tr:last-child td{border-bottom:0}th{background:var(--surface2);color:var(--muted);font-size:10px;text-transform:uppercase}tbody tr:hover{background:#11161a}.ok{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--amber)}code{color:var(--cyan);font:12px ui-monospace,SFMono-Regular,Menlo,monospace}.error-text{color:var(--red);max-width:320px;overflow:hidden;text-overflow:ellipsis}.empty{border:1px dashed var(--line);border-radius:7px;color:var(--muted);padding:18px}.login{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin:12vh auto;max-width:430px;padding:24px}.login h1{font-size:20px;margin:0 0 6px}.login p{color:var(--muted);margin:0 0 18px}.login input{flex:1}.key-result{color:var(--green);margin-top:10px;overflow-wrap:anywhere}.danger{color:var(--red)}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.provider-grid{grid-template-columns:1fr 1fr}}@media(max-width:620px){main{padding:18px 14px 40px}header{align-items:start}.stats,.provider-grid{grid-template-columns:1fr}.actions{justify-content:flex-end}.form input{min-width:100%;width:100%}}
  </style>
</head>
<body>
<main>
  <section id="login" class="login">
    <h1>AI Gateway</h1>
    <p>Enter the admin key to open the local operations console.</p>
    <div class="form"><input id="admin-key" type="password" autocomplete="off" placeholder="Admin API key"><button onclick="signIn()">Open console</button></div>
    <div id="login-error" class="danger"></div>
  </section>
  <section id="app" hidden>
    <header><div class="brand"><div class="mark">AG</div><div><h1>AI Gateway</h1><div class="sub">Traffic, providers, cost and access</div></div></div><div class="actions"><button onclick="load()">Refresh</button><button onclick="signOut()">Sign out</button></div></header>
    <section id="stats" class="stats"></section>
    <section class="section"><div class="section-head"><h2>Providers</h2><span id="provider-count" class="count"></span></div><div id="providers" class="provider-grid"></div></section>
    <section class="section"><div class="section-head"><h2>Usage by provider</h2><span class="count">Estimated from configured token prices</span></div><div id="breakdown"></div></section>
    <section class="section"><div class="section-head"><h2>Recent requests</h2><span class="count">Latest 50</span></div><div id="requests"></div></section>
    <section class="section"><div class="section-head"><h2>Managed API keys</h2><span id="key-count" class="count"></span></div><div class="form"><input id="key-name" placeholder="Client name"><input id="request-limit" type="number" min="1" placeholder="Request limit"><input id="token-limit" type="number" min="1" placeholder="Token limit"><button onclick="createKey()">Create key</button></div><div id="key-result" class="key-result"></div><div id="keys" style="margin-top:12px"></div></section>
  </section>
</main>
<script>
let token=sessionStorage.getItem('ai_gateway_admin_key')||'';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>Number(n||0).toLocaleString(),money=n=>'$'+Number(n||0).toFixed(6),ms=n=>Number(n||0).toFixed(1)+' ms';
function auth(){return token?{Authorization:'Bearer '+token}:{}}
function signIn(){token=$('admin-key').value.trim();if(!token)return;sessionStorage.setItem('ai_gateway_admin_key',token);load()}
function signOut(){sessionStorage.removeItem('ai_gateway_admin_key');token='';$('app').hidden=true;$('login').hidden=false}
async function get(path){const r=await fetch(path,{headers:auth()});const data=await r.json();if(!r.ok)throw Error(data.error?.message||'request failed');return data}
function table(head,rows){return rows.length?`<div class="table-wrap"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:'<div class="empty">No data yet</div>'}
async function createKey(){try{const name=$('key-name').value.trim();if(!name)return;const body={name};if($('request-limit').value)body.request_limit=Number($('request-limit').value);if($('token-limit').value)body.token_limit=Number($('token-limit').value);const r=await fetch('/admin/api-keys',{method:'POST',headers:{...auth(),'content-type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error?.message||'request failed');$('key-result').textContent='Save now: '+data.key;$('key-name').value='';$('request-limit').value='';$('token-limit').value='';load()}catch(e){$('key-result').textContent=e.message}}
async function revokeKey(id){if(!confirm('Revoke this key?'))return;const r=await fetch('/admin/api-keys/'+id,{method:'DELETE',headers:auth()});if(!r.ok)throw Error((await r.json()).error?.message||'request failed');load()}
async function load(){if(!token)return;try{const [stats,health,keys,breakdown,requests]=await Promise.all([get('/admin/stats'),get('/health'),get('/admin/api-keys'),get('/admin/breakdown'),get('/admin/requests?limit=50')]);$('login').hidden=true;$('app').hidden=false;$('login-error').textContent='';const rate=stats.requests?Math.round(stats.successful_requests/stats.requests*100)+'%':'0%';$('stats').innerHTML=[['Requests',num(stats.requests)],['Success rate',rate],['Tokens',num(stats.total_tokens)],['Estimated cost',money(stats.estimated_cost)],['Avg latency',ms(stats.average_latency_ms)]].map(([a,b])=>`<div class="stat"><div class="label">${a}</div><div class="value">${b}</div></div>`).join('');$('provider-count').textContent=health.providers.length+' configured';$('providers').innerHTML=health.providers.map(p=>`<div class="provider"><div class="provider-top"><span class="provider-name">${esc(p.name)}</span><span class="${p.status}"><i class="dot ${p.status}"></i>${p.status}</span></div><div class="meta">${esc(p.kind)} · ${esc(p.model)}<br>${num(p.requests)} requests · ${p.available_concurrency}/${p.max_concurrency} slots · ${ms(p.average_latency_ms)}</div></div>`).join('')||'<div class="empty">No providers configured</div>';$('breakdown').innerHTML=table(['Provider','Model','Requests','Success','Tokens','Cost','Latency'],breakdown.providers.map(p=>`<tr><td>${esc(p.provider)}</td><td><code>${esc(p.model)}</code></td><td>${num(p.requests)}</td><td>${num(p.successful_requests)}</td><td>${num(p.total_tokens)}</td><td>${money(p.estimated_cost)}</td><td>${ms(p.average_latency_ms)}</td></tr>`));$('requests').innerHTML=table(['Time','Request','Provider / Model','Mode','Status','Tokens','Cost','Latency','Error'],requests.data.map(r=>`<tr><td>${new Date(r.created_at*1000).toLocaleString()}</td><td><code title="${esc(r.request_id)}">${esc(r.request_id.slice(0,16))}</code></td><td>${esc(r.provider)}<br><code>${esc(r.model)}</code></td><td>${r.stream?'stream':'standard'}</td><td class="${r.status<400?'ok':'bad'}">${r.status}</td><td>${num(r.total_tokens)}</td><td>${money(r.estimated_cost)}</td><td>${ms(r.latency_ms)}</td><td class="error-text" title="${esc(r.error)}">${esc(r.error||'')}</td></tr>`));$('key-count').textContent=keys.data.filter(k=>!k.revoked_at).length+' active';$('keys').innerHTML=table(['Name','Prefix','Requests','Tokens','Limits','State',''],keys.data.map(k=>`<tr><td>${esc(k.name)}</td><td><code>${esc(k.prefix)}...</code></td><td>${num(k.requests)}</td><td>${num(k.tokens)}</td><td>${k.request_limit??'∞'} req / ${k.token_limit??'∞'} tok</td><td class="${k.revoked_at?'bad':'ok'}">${k.revoked_at?'revoked':'active'}</td><td>${k.revoked_at?'':`<button onclick="revokeKey(${k.id})">Revoke</button>`}</td></tr>`))}catch(e){$('login').hidden=false;$('app').hidden=true;$('login-error').textContent=e.message}}
if(token)load();setInterval(()=>{if(token&&!document.hidden)load()},15000);
</script>
</body>
</html>
