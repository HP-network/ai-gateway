<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Gateway | Operations</title>
  <style>
    :root{color-scheme:dark;--bg:#080d18;--panel:#111a2b;--line:#263752;--text:#e8eef9;--muted:#91a0b8;--good:#37d39a;--warn:#f4c95d;--bad:#ff7088;--blue:#79a9ff}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% -10%,#1d3760 0,transparent 35%),var(--bg);color:var(--text);font:14px/1.55 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:1180px;margin:auto;padding:42px 22px 72px}header{align-items:end;display:flex;justify-content:space-between;gap:20px;margin-bottom:28px}.eyebrow{color:var(--blue);font-size:12px;font-weight:700;letter-spacing:.15em}.title{font-size:36px;letter-spacing:-.045em;margin:3px 0}.muted{color:var(--muted)}.panel,.stat{background:rgba(17,26,43,.88);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 42px #0003}.panel{margin:0 0 18px;padding:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat{padding:17px}.stat-label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em}.stat-value{font-size:28px;font-weight:750;margin-top:4px}.row{align-items:center;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;padding:14px 0}.row:last-child{border-bottom:0}.provider-name{font-weight:700}.provider-meta{color:var(--muted);font-size:13px;margin-top:2px}.status{font-weight:700}.healthy{color:var(--good)}.degraded{color:var(--warn)}.unavailable{color:var(--bad)}.unknown{color:var(--muted)}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid var(--line);padding:11px 8px;text-align:left}th{color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase}button,input{background:#172641;border:1px solid #3a5786;border-radius:8px;color:var(--text);padding:9px 12px}button{cursor:pointer;font-weight:650}button:hover{background:#24436f}input{min-width:220px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.empty{color:var(--muted);padding:15px 0}.login{max-width:520px;margin:90px auto}.error{color:var(--bad);margin-top:10px}@media(max-width:760px){main{padding:24px 14px}.stats{grid-template-columns:repeat(2,1fr)}header{display:block}.header-action{margin-top:14px}.row{align-items:start;display:block}.status{margin-top:8px}}
  </style>
</head>
<body>
<main>
  <section id="login" class="panel login"><div class="eyebrow">ADMIN CONSOLE</div><h1 class="title">AI Gateway</h1><p class="muted">Enter the admin API key to inspect providers, usage, and managed clients.</p><div class="toolbar"><input id="admin-key" type="password" autocomplete="off" placeholder="Admin API key"><button onclick="signIn()">Open console</button></div><div id="login-error" class="error"></div></section>
  <section id="app" hidden><header><div><div class="eyebrow">OPERATIONS</div><h1 class="title">Gateway control plane</h1><div class="muted">Live provider health, access, and traffic</div></div><div class="header-action"><button onclick="load()">Refresh</button><button onclick="signOut()">Sign out</button></div></header><section id="stats" class="stats"></section><section class="panel"><h2>Providers</h2><div id="providers" class="empty">Loading...</div></section><section class="panel"><h2>Managed API keys</h2><div class="toolbar"><input id="key-name" placeholder="New client name"><input id="request-limit" type="number" min="1" placeholder="Request limit"><input id="token-limit" type="number" min="1" placeholder="Token limit"><button onclick="createKey()">Create key</button></div><div id="keys" class="empty">Loading...</div></section></section>
</main>
<script>
let token=sessionStorage.getItem('ai_gateway_admin_key')||'';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function auth(){return token?{Authorization:'Bearer '+token}:{} }function signIn(){token=$('admin-key').value.trim();if(!token)return;sessionStorage.setItem('ai_gateway_admin_key',token);load()}function signOut(){sessionStorage.removeItem('ai_gateway_admin_key');token='';$('app').hidden=true;$('login').hidden=false}
async function get(path){const r=await fetch(path,{headers:auth()});if(!r.ok)throw Error((await r.json()).error?.message||'request failed');return r.json()}
async function createKey(){try{const name=$('key-name').value.trim();if(!name)return;const requestLimit=$('request-limit').value;const tokenLimit=$('token-limit').value;const payload={name};if(requestLimit)payload.request_limit=Number(requestLimit);if(tokenLimit)payload.token_limit=Number(tokenLimit);const r=await fetch('/admin/api-keys',{method:'POST',headers:{...auth(),'content-type':'application/json'},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok)throw Error(data.error?.message||'request failed');alert('Save this token now. It will not be shown again:\n\n'+data.key);$('key-name').value='';$('request-limit').value='';$('token-limit').value='';load()}catch(e){alert(e.message)}}
async function revokeKey(id){if(!confirm('Revoke this key?'))return;try{const r=await fetch('/admin/api-keys/'+id,{method:'DELETE',headers:auth()});if(!r.ok)throw Error((await r.json()).error?.message||'request failed');load()}catch(e){alert(e.message)}}
async function load(){if(!token)return;try{const [stats,health,keys]=await Promise.all([get('/admin/stats'),get('/health'),get('/admin/api-keys')]);$('login').hidden=true;$('app').hidden=false;$('stats').innerHTML=[['Requests',stats.requests],['Successful',stats.successful_requests],['Tokens',stats.total_tokens],['Avg latency',stats.average_latency_ms+' ms']].map(([label,value])=>`<div class="stat"><div class="stat-label">${label}</div><div class="stat-value">${value}</div></div>`).join('');$('providers').innerHTML=health.providers.map(p=>`<div class="row"><div><div class="provider-name">${esc(p.name)}</div><div class="provider-meta">${esc(p.kind)} · ${esc(p.model)} · ${p.requests} requests · ${p.available_concurrency}/${p.max_concurrency} slots</div></div><div class="status ${p.status}">${p.status}</div></div>`).join('')||'<div class="empty">No providers configured</div>';$('keys').innerHTML=keys.data.length?`<table><thead><tr><th>Name</th><th>Prefix</th><th>Requests</th><th>Tokens</th><th>Limits</th><th>State</th><th></th></tr></thead><tbody>${keys.data.map(k=>`<tr><td>${esc(k.name)}</td><td>${esc(k.prefix)}...</td><td>${k.requests}</td><td>${k.tokens}</td><td>${k.request_limit??'∞'} req / ${k.token_limit??'∞'} tok</td><td class="${k.revoked_at?'unavailable':'healthy'}">${k.revoked_at?'revoked':'active'}</td><td>${k.revoked_at?'':'<button onclick="revokeKey('+k.id+')">Revoke</button>'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No managed keys yet</div>';$('login-error').textContent=''}catch(e){$('login').hidden=false;$('app').hidden=true;$('login-error').textContent=e.message}}if(token)load();setInterval(()=>{if(token)load()},15000);
</script>
</body>
</html>
